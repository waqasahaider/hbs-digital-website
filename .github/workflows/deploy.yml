name: Deploy to VPS

# Deploys on every push to main. Content changes go live with zero
# downtime (bind-mounted files); config changes recreate the container.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            cd /docker/hbs-site
            ./deploy.sh

# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      → <VPS_IP>
#   VPS_USER      → deploy   (a non-root user; or root for the simplest start)
#   VPS_SSH_PORT  → 22
#   VPS_SSH_KEY   → the PRIVATE key whose public half is in the VPS user's
#                    ~/.ssh/authorized_keys
