name: Deploy to VPS

# Deploys on every push to main. Static/content changes go live with
# zero downtime (bind-mounted files); infra changes recreate containers.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allow manual runs from the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            cd /opt/hbs/hbs-digital-website
            ./infra/deploy.sh

# Required GitHub repo secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST      → the VPS IP address
#   VPS_USER      → the non-root deploy user (e.g. deploy)
#   VPS_SSH_PORT  → SSH port (e.g. 22, or your custom port)
#   VPS_SSH_KEY   → the PRIVATE key whose public half is in the deploy
#                    user's ~/.ssh/authorized_keys on the VPS
