# === MAINTENANCE MODE ===
# Serves the holding page (HTTP 503) for every request, hiding the real site.
# To relaunch: restore the live config from nginx/nginx.live.conf, then restart
# the container (docker restart hbs-site-web-1).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    add_header Cache-Control "no-store, must-revalidate" always;
    add_header Retry-After 3600 always;

    # The holding page is only reachable via the internal 503 redirect.
    location = /maintenance.html { internal; }

    # Everything returns 503 → served as the holding page.
    location / { return 503; }
    error_page 503 /maintenance.html;
}
