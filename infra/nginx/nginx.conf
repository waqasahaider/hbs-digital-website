# nginx config for the static site (served behind Traefik).
# Traefik terminates TLS and forwards plain HTTP here on the `edge` network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (TLS/HSTS is handled by Traefik) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # --- Long cache for fingerprint-free static assets ---
    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # --- Clean folder-based URLs: /about/ -> /about/index.html ---
    location / {
        try_files $uri $uri/ =404;
    }

    # --- Custom 404 ---
    error_page 404 /404.html;

    # Don't serve dotfiles (e.g. a stray .htaccess)
    location ~ /\. {
        deny all;
    }
}
