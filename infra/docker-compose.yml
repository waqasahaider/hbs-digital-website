# ============================================================
# H b&s Digital — production stack for Hostinger KVM 2 VPS
#
#   Traefik  → reverse proxy, automatic HTTPS (Let's Encrypt),
#              HTTP→HTTPS redirect, routes by container labels
#   web      → nginx serving the static site (../site, read-only)
#
# Adding a new service later (CRM/API, n8n) = add a service block
# with traefik labels + join the `edge` network. Nothing else changes.
# See ./services/n8n.yml for a ready-made example.
# ============================================================

name: hbs

networks:
  edge:
    name: edge

volumes:
  traefik_letsencrypt:

services:
  # ---------- Reverse proxy + TLS ----------
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    command:
      # Docker provider — only containers we explicitly enable are exposed
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=edge"
      # Entry points
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      # Global HTTP → HTTPS redirect
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      # Let's Encrypt (HTTP-01 challenge over the `web` entrypoint)
      - "--certificatesresolvers.le.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.le.acme.httpchallenge=true"
      - "--certificatesresolvers.le.acme.httpchallenge.entrypoint=web"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - edge

  # ---------- Static website ----------
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      # The site is bind-mounted read-only. A `git pull` updates these
      # files in place and nginx serves them instantly — zero downtime,
      # no container restart needed.
      - ../site:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      # Route the apex domain and www to this service
      - "traefik.http.routers.web.rule=Host(`${SITE_DOMAIN}`) || Host(`www.${SITE_DOMAIN}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls=true"
      - "traefik.http.routers.web.tls.certresolver=le"
      - "traefik.http.services.web.loadbalancer.server.port=80"
      # Redirect www → apex (canonical host)
      - "traefik.http.routers.web.middlewares=www-redirect"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"
