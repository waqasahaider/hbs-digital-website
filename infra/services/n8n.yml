# ============================================================
# FUTURE SERVICE — n8n (workflow automation)
#
# This is a ready-to-use overlay showing the pattern for adding a
# service to the same VPS + Traefik. It is NOT started by default.
#
# To bring it up later:
#   1. Add these vars to infra/.env:
#        N8N_DOMAIN=n8n.hbsdigital.ae
#        N8N_BASIC_AUTH_USER=admin
#        N8N_BASIC_AUTH_PASSWORD=<a long random password>
#        N8N_ENCRYPTION_KEY=<a long random string>
#        GENERIC_TIMEZONE=Asia/Dubai
#   2. Point DNS: an A record  n8n.hbsdigital.ae → <VPS IP>
#   3. Start it alongside the main stack:
#        cd infra
#        docker compose -f docker-compose.yml -f services/n8n.yml up -d
#
# Traefik will route it and issue its TLS cert automatically.
# The CRM/API would follow the exact same shape (its own service block).
# ============================================================

name: hbs

networks:
  edge:
    external: true

volumes:
  n8n_data:

services:
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - N8N_PORT=5678
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Dubai}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=le"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
